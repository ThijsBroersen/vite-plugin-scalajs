name: Snapshot

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Set up JDK 21
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:1.21
          apps: sbt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sbt once in the test project
        run: sbt projects
        working-directory: ./test/sbt-project

      - name: Run sbt once in the sbt 2 test project
        run: sbt "projects ; shutdown"
        working-directory: ./test/sbt-2-project

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Set snapshot version from package.json + commit SHA
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          SNAPSHOT="${BASE}-snapshot.${SHORT_SHA}"
          npm version "${SNAPSHOT}" --no-git-tag-version --allow-same-version
          echo "version=${SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "Publishing snapshot ${SNAPSHOT} to npm dist-tag snapshot"

      - name: Publish snapshot to npm
        run: npm publish --access public --provenance --tag snapshot
