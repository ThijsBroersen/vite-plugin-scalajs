name: Release

# Snapshots and stable releases share this workflow file so npm Trusted Publishing
# (configured for release.yml) applies to both.
on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Resolve publish mode (snapshot vs tagged release)
        id: publish
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            PKG=$(node -p "require('./package.json').version")
            if [[ "$TAG" != "$PKG" ]]; then
              echo "Tag v$TAG does not match package.json version $PKG"
              exit 1
            fi
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=$PKG" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            BASE=$(node -p "require('./package.json').version")
            SHORT_SHA=$(git rev-parse --short HEAD)
            SNAPSHOT="${BASE}-snapshot.${SHORT_SHA}"
            npm version "${SNAPSHOT}" --no-git-tag-version --allow-same-version
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
            echo "version=${SNAPSHOT}" >> "$GITHUB_OUTPUT"
            echo "dist_tag=snapshot" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:1.21
          apps: sbt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sbt once in the test project
        run: sbt projects
        working-directory: ./test/sbt-project

      - name: Run sbt once in the sbt 2 test project
        run: sbt "projects ; shutdown"
        working-directory: ./test/sbt-2-project

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: |
          MODE="${{ steps.publish.outputs.mode }}"
          DIST_TAG="${{ steps.publish.outputs.dist_tag }}"
          VERSION="${{ steps.publish.outputs.version }}"
          echo "Publishing ${MODE} ${VERSION} with dist-tag ${DIST_TAG}"
          if [[ "$MODE" == "release" && "$VERSION" =~ -(beta|rc|alpha) ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance --tag "${DIST_TAG}"
          fi
